## Basic virtual environment
1. create virtual env
```bash
$ virtualenv /tmp/venv
```
2. activate it for this shell
```bash
$ . /tmp/venv/bin/activate
```
3. install modules in the env
```bash
(venv) $ pip install ansible==10.7.0
(venv) $ ansible --version
ansible [core 2.17.11]
```

## Let your dependencies travel in git
My favourite: pipenv
```bash [1]
$ pipenv install flask
```
```bash [1]
$ cat Pipfile
[[source]]
url = "https://pypi.org/simple"
verify_ssl = true
name = "pypi"

[packages]
flask = "*"

[dev-packages]

[requires]
python_version = "3.11"
```

## From pipenv to production
1. create requirements.txt for virtualenv
```bash
$ pipenv requirements > requirements.txt
```

2. deploy explicit venv e.g. with Ansible
```yaml
- name: Create virtual environment
  ansible.builtin.pip:
    virtualenv: "{{ install_dir }}/venv"
    requirements: "{{ install_dir }}/requirements.txt"
---
